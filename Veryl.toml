[project]
name = "gndless_interpolation"
version = "0.2.0"
authors = ["Akiyuki Okayasu"]
description = "Combinational sample interpolation kernels for Veryl."
license = "MIT OR Apache-2.0"
repository = "https://github.com/AkiyukiOkayasu/gndless-interpolation-veryl"

[build]
sources = ["src"]
target = { type = "directory", path = "target" }

[test]

[dependencies]
gndless_fixedpoint = { github = "AkiyukiOkayasu/gndless-fixedpoint-veryl", version = "0.2.0" }

[publish]
register = true
bump_commit = true
publish_commit = true
